[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cjm-workflow-hub-qt"
version = "0.0.2"
description = "Qt front door for cjm-substrate workflows — a direct port IN SPIRIT of cjm-workflow-hub-tui (DEC 61b46ae8, the c4b0d6e5 lane's last migration): the same collection-grouped source browse with stage-at-a-glance pipeline status and the same curation vocabulary (confirm / rename / refile / order / merge by title identity), whose pure spine it imports verbatim; the hub is a launcher, so under Qt it SPAWNS the stage apps as detached processes across their core envs instead of suspending into them. Born on-graph."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Christian J. Mills", email = "9126128+cj-mills@users.noreply.github.com"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['cjm-transcription-core>=0.0.8', 'cjm-transcript-correction-core>=0.0.6', 'cjm-context-graph-layer>=0.0.11', 'cjm-context-graph-primitives>=0.0.15', 'cjm-transcript-graph-schema>=0.0.7', 'cjm-substrate>=0.0.61', 'cjm-substrate-qt-kit>=0.0.1', 'PySide6']

[project.scripts]
cjm-workflow-hub-qt = "cjm_workflow_hub_qt.cli:main"

[project.urls]
Repository = "https://github.com/cj-mills/cjm-workflow-hub-qt"

[tool.setuptools.packages.find]
include = ["cjm_workflow_hub_qt*"]
